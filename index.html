<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de la Flor Amarilla</title>
  <!-- Importación de fuentes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-yellow: #ffff00;
      --neon-green: #ccff00;
      --glow-light: #ffffff;
      --bg-color: #030308;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* Canvas para la Galaxia y Estrellas Fugaces */
    #galaxyCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    /* Ventana Modal de Bienvenida */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 3, 8, 0.88);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      padding: 20px;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 0, 0.15);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .welcome-title {
      font-family: 'Dancing Script', cursive;
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 0 0 12px var(--neon-yellow);
    }

    .welcome-subtitle {
      font-family: 'Dancing Script', cursive;
      color: #eeeeee;
      font-size: 1.45rem;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .start-btn {
      font-family: 'Dancing Script', cursive;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 2px solid var(--neon-yellow);
      padding: 10px 32px;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 255, 0, 0.4);
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .start-btn:hover {
      background: var(--neon-yellow);
      color: #000000;
      box-shadow: 0 0 25px var(--neon-yellow);
      transform: translateY(-2px) scale(1.03);
    }

    .start-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .welcome-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Tarjeta estilo Cristal */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px 15px 25px 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 380px;
      position: relative;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      width: 100%;
      animation: float 4s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }

    svg {
      width: 100%;
      height: auto;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .rotating-head {
      transform-origin: 200px 150px;
      animation: spin 18s linear infinite;
      transition: animation-duration 0.5s ease;
    }

    .container:hover .rotating-head {
      animation-duration: 5s;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .neon-glow {
      animation: pulse 2.5s ease-in-out infinite alternate;
      transition: filter 0.3s ease;
    }

    @keyframes pulse {
      0% { filter: drop-shadow(0 0 8px var(--neon-yellow)) drop-shadow(0 0 15px var(--neon-yellow)); }
      100% { filter: drop-shadow(0 0 18px var(--neon-yellow)) drop-shadow(0 0 35px var(--glow-light)); }
    }

    .shadow {
      width: 90px;
      height: 12px;
      background: rgba(204, 255, 0, 0.25);
      border-radius: 50%;
      filter: blur(8px);
      margin-top: 5px;
      animation: shadow-scale 4s ease-in-out infinite;
    }

    @keyframes shadow-scale {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(0.6); opacity: 0.2; }
    }

    .neon-text {
      color: #ffffff;
      margin-top: 18px;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-yellow);
      user-select: none;
      transition: text-shadow 0.3s ease;
    }

    .counter-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      margin-top: 12px;
      color: #ffffff;
      font-size: 0.85rem;
      user-select: none;
    }

    .heart-icon {
      color: var(--neon-yellow);
      transition: transform 0.2s ease, color 0.3s ease;
    }

    /* Partículas al tocar */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: var(--neon-yellow);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-yellow);
      pointer-events: none;
      animation: sparkle 0.8s forwards ease-out;
    }

    @keyframes sparkle {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }

    /* Mensaje final al pie de la pantalla */
    .footer-love-text {
      font-family: 'Sacramento', cursive;
      color: #ffffff;
      font-size: 2.8rem;
      margin-top: 25px;
      text-align: center;
      text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-yellow), 0 0 30px var(--neon-yellow);
      user-select: none;
      animation: glowText 3s ease-in-out infinite alternate;
    }

    @keyframes glowText {
      0% { opacity: 0.8; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <!-- Canvas Galáctico -->
  <canvas id="galaxyCanvas"></canvas>

  <!-- Mensaje de Bienvenida -->
  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="welcome-card">
      <h1 class="welcome-title">¡Feliz Primavera!</h1>
      <p class="welcome-subtitle">Hoy es un día especial para llenar tu camino de luz, alegría y flores amarillas.</p>
      <button class="start-btn" id="startBtn">Ver mi regalo</button>
    </div>
  </div>

  <!-- Tarjeta Cristal -->
  <div class="glass-card">
    <div class="container" id="flowerContainer">
      <svg width="400" height="420" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="petal-grad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="var(--neon-yellow)" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="var(--neon-yellow)" stop-opacity="1"/>
          </linearGradient>

          <g id="single-petal">
            <path d="M 200,150 C 180,100 185,50 200,30 C 215,50 220,100 200,150 Z" 
                  fill="url(#petal-grad)" 
                  stroke="#ffffaa" 
                  stroke-width="2"/>
          </g>
        </defs>

        <!-- Tallo y Hojas -->
        <g>
          <path d="M 200,150 Q 198,260 200,370" 
                fill="none" 
                stroke="var(--neon-green)" 
                stroke-width="8" 
                stroke-linecap="round"
                filter="drop-shadow(0 0 10px var(--neon-green))"/>

          <path d="M 198,240 C 150,230 140,200 150,190 C 170,200 190,220 198,240 Z" 
                fill="rgba(204, 255, 0, 0.3)" 
                stroke="var(--neon-green)" 
                stroke-width="2"
                filter="drop-shadow(0 0 8px var(--neon-green))"/>

          <path d="M 202,270 C 250,260 260,230 250,220 C 230,230 210,250 202,270 Z" 
                fill="rgba(204, 255, 0, 0.3)" 
                stroke="var(--neon-green)" 
                stroke-width="2"
                filter="drop-shadow(0 0 8px var(--neon-green))"/>
        </g>

        <!-- Cabeza de la flor -->
        <g class="rotating-head neon-glow">
          <use href="#single-petal" transform="rotate(0, 200, 150)"/>
          <use href="#single-petal" transform="rotate(45, 200, 150)"/>
          <use href="#single-petal" transform="rotate(90, 200, 150)"/>
          <use href="#single-petal" transform="rotate(135, 200, 150)"/>
          <use href="#single-petal" transform="rotate(180, 200, 150)"/>
          <use href="#single-petal" transform="rotate(225, 200, 150)"/>
          <use href="#single-petal" transform="rotate(270, 200, 150)"/>
          <use href="#single-petal" transform="rotate(315, 200, 150)"/>

          <circle cx="200" cy="150" r="25" fill="var(--glow-light)" filter="drop-shadow(0 0 15px var(--neon-yellow))"/>
        </g>
      </svg>

      <div class="shadow"></div>
      <div class="neon-text">Toca la flor</div>
    </div>

    <!-- Contador de toques -->
    <div class="counter-badge">
      <span class="heart-icon" id="heartIcon">♥</span>
      <span id="clickCounter">0</span> Toques
    </div>
  </div>

  <!-- Mensaje Especial al Pie -->
  <div class="footer-love-text">Te amo HANNI :3</div>

  <script>
    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const startBtn = document.getElementById('startBtn');
    const container = document.getElementById('flowerContainer');
    const counterDisplay = document.getElementById('clickCounter');
    const heartIcon = document.getElementById('heartIcon');
    const colores = ['#ffff00', '#00ffff', '#ff007f', '#39ff14'];
    let indiceColor = 0;
    let count = 0;

    // Cerrar bienvenida
    startBtn.addEventListener('click', () => {
      welcomeOverlay.classList.add('hidden');
    });

    // Interacción con la flor
    container.addEventListener('pointerdown', (e) => {
      count++;
      counterDisplay.textContent = count;
      heartIcon.style.transform = 'scale(1.4)';
      setTimeout(() => heartIcon.style.transform = 'scale(1)', 200);

      indiceColor = (indiceColor + 1) % colores.length;
      document.documentElement.style.setProperty('--neon-yellow', colores[indiceColor]);

      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = 0; i < 16; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');

        const angle = Math.random() * Math.PI * 2;
        const distance = 30 + Math.random() * 50;
        const dx = Math.cos(angle) * distance + 'px';
        const dy = Math.sin(angle) * distance + 'px';

        particle.style.left = `${clickX}px`;
        particle.style.top = `${clickY}px`;
        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--dy', dy);

        container.appendChild(particle);

        setTimeout(() => particle.remove(), 800);
      }
    });

    /* --- EFECTO GALAXIA Y ESTRELLAS FUGACES --- */
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Crear estrellas fijas
    const stars = [];
    const numStars = 150;
    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5,
        alpha: Math.random(),
        speed: 0.005 + Math.random() * 0.015
      });
    }

    // Crear estrellas fugaces
    const shootingStars = [];

    function addShootingStar() {
      shootingStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height / 2),
        length: 80 + Math.random() * 60,
        speed: 8 + Math.random() * 6,
        dx: 4 + Math.random() * 2,
        dy: 4 + Math.random() * 2,
        alpha: 1
      });
    }

    // Generar estrellas fugaces periódicamente
    setInterval(addShootingStar, 2500);

    function animateGalaxy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar nebulosa sutil de galaxia
      const bgGradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 50,
        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
      );
      bgGradient.addColorStop(0, 'rgba(25, 10, 45, 0.4)');
      bgGradient.addColorStop(0.5, 'rgba(10, 5, 25, 0.2)');
      bgGradient.addColorStop(1, 'rgba(3, 3, 8, 0)');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar estrellas titilantes
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.fill();
      });

      // Dibujar estrellas fugaces
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        
        const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.length, s.y - s.length);
        grad.addColorStop(0, `rgba(255, 255, 255, ${s.alpha})`);
        grad.addColorStop(0.3, `rgba(255, 255, 0, ${s.alpha * 0.8})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.length, s.y - s.length);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.stroke();

        s.x += s.dx;
        s.y += s.dy;
        s.alpha -= 0.012;

        if (s.alpha <= 0 || s.x > canvas.width || s.y > canvas.height) {
          shootingStars.splice(i, 1);
        }
      }

      requestAnimationFrame(animateGalaxy);
    }

    animateGalaxy();
  </script>

</body>
</html>
